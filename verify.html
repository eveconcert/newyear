<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Verification — Eve Concert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --ink: #0d0d0d;
        --cream: #f3ecdd;
        --green: #1a7a4a;
        --green-light: #edfaf3;
        --red: #c0392b;
        --red-light: #fdf0ee;
        --gold: #d9a441;
        --muted: #888;
        --line: #e0d9cc;
      }

      body {
        font-family: "Work Sans", sans-serif;
        background: var(--cream);
        color: var(--ink);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }

      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 32px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 420px;
        overflow: hidden;
      }

      /* ── Loading state ─────── */
      .state-loading {
        padding: 48px 32px;
        text-align: center;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid var(--line);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .state-loading p {
        color: var(--muted);
        font-size: 0.95rem;
      }

      /* ── Result header ─────── */
      .result-header {
        padding: 28px 28px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .result-header--valid {
        background: var(--green);
      }
      .result-header--invalid {
        background: var(--red);
      }

      .result-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        flex-shrink: 0;
      }
      .result-title {
        font-family: "Fraunces", serif;
        font-size: 1.5rem;
        color: #fff;
        line-height: 1.1;
      }
      .result-subtitle {
        font-size: 0.82rem;
        color: rgba(255, 255, 255, 0.75);
        margin-top: 4px;
      }

      /* ── Ticket details ─────── */
      .ticket-details {
        padding: 24px 28px;
      }
      .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        font-size: 0.9rem;
      }
      .detail-row:last-child {
        border-bottom: none;
      }
      .detail-label {
        color: var(--muted);
        flex-shrink: 0;
      }
      .detail-value {
        font-weight: 600;
        text-align: right;
      }
      .detail-value--id {
        font-family: monospace;
        font-size: 0.82rem;
        color: var(--gold);
        word-break: break-all;
      }

      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge--vip {
        background: #fff3cd;
        color: #7a5c00;
      }
      .badge--normal {
        background: #e8f4ff;
        color: #1a4a7a;
      }

      /* ── Invalid / error ─────── */
      .error-body {
        padding: 24px 28px;
        font-size: 0.92rem;
        color: var(--muted);
        line-height: 1.6;
      }
      .error-code {
        font-family: monospace;
        font-size: 0.8rem;
        background: #f5f5f5;
        border-radius: 4px;
        padding: 2px 6px;
        color: var(--red);
      }

      /* ── Footer ─────────────── */
      .card-footer {
        padding: 16px 28px;
        border-top: 1px solid var(--line);
        font-size: 0.78rem;
        color: var(--muted);
        text-align: center;
      }

      /* ── Bad QR (no params) ── */
      .bad-qr {
        padding: 48px 32px;
        text-align: center;
      }
      .bad-qr .icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      .bad-qr h2 {
        font-family: "Fraunces", serif;
        font-size: 1.4rem;
        margin-bottom: 8px;
      }
      .bad-qr p {
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="state-loading">
        <div class="spinner"></div>
        <p>Verifying ticket…</p>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const ref = params.get("ref");
      const seatId = params.get("seat");
      const phone = params.get("phone");

      const card = document.getElementById("card");

      function packageLabel(seatId) {
        // seatId format: EVE-XXXXXX-N1 or EVE-XXXXXX-V1
        if (!seatId) return "—";
        const part = seatId.split("-").pop() || "";
        if (part.startsWith("V")) return "VIP";
        if (part.startsWith("N")) return "Normal";
        return "—";
      }

      function packageBadgeClass(seatId) {
        const part = (seatId || "").split("-").pop() || "";
        return part.startsWith("V") ? "vip" : "normal";
      }

      function renderValid(order) {
        const pkg = packageLabel(seatId);
        const badge = packageBadgeClass(seatId);
        const ts = new Date().toLocaleTimeString("en-GB", {
          hour: "2-digit",
          minute: "2-digit",
        });

        card.innerHTML = `
      <div class="result-header result-header--valid">
        <div class="result-icon">✓</div>
        <div>
          <div class="result-title">Valid Ticket</div>
          <div class="result-subtitle">Eve Concert — Enkutatash 2019</div>
        </div>
      </div>
      <div class="ticket-details">
        <div class="detail-row">
          <span class="detail-label">Name</span>
          <span class="detail-value">${esc(order.fullName)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Phone</span>
          <span class="detail-value">${esc(order.phone)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Package</span>
          <span class="detail-value">
            <span class="badge badge--${badge}">${pkg}</span>
          </span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Ticket ID</span>
          <span class="detail-value detail-value--id">${esc(seatId)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Order ref</span>
          <span class="detail-value detail-value--id">${esc(ref)}</span>
        </div>
      </div>
      <div class="card-footer">Verified at ${ts} · Sheraton Addis, Sep 10</div>
    `;
      }

      function renderInvalid(reason) {
        card.innerHTML = `
      <div class="result-header result-header--invalid">
        <div class="result-icon">✕</div>
        <div>
          <div class="result-title">Invalid Ticket</div>
          <div class="result-subtitle">Do not admit this guest</div>
        </div>
      </div>
      <div class="error-body">
        <p>${esc(reason)}</p>
        ${
          seatId
            ? `<p style="margin-top:12px;">Ticket ID: <span class="error-code">${esc(
                seatId
              )}</span></p>`
            : ""
        }
      </div>
      <div class="card-footer">Eve Concert — Enkutatash 2019 · Sheraton Addis</div>
    `;
      }

      function renderBadQr() {
        card.innerHTML = `
      <div class="bad-qr">
        <div class="icon">⚠️</div>
        <h2>Invalid QR Code</h2>
        <p>This QR code is missing ticket data. Please use the code printed on the guest's ticket.</p>
      </div>
    `;
      }

      function esc(str) {
        const d = document.createElement("div");
        d.textContent = str == null ? "" : String(str);
        return d.innerHTML;
      }

      async function verify() {
        if (!ref || !phone) {
          renderBadQr();
          return;
        }

        try {
          const url = `/api/order-status?reference=${encodeURIComponent(
            ref
          )}&phone=${encodeURIComponent(phone)}`;
          const res = await fetch(url);

          if (res.status === 404) {
            renderInvalid(
              "No order found for this ticket. The QR code may be fake or altered."
            );
            return;
          }
          if (!res.ok) {
            renderInvalid(
              "Verification service unavailable. Please try again or contact the organiser."
            );
            return;
          }

          const order = await res.json();

          if (order.status === "approved") {
            // Double-check the seat ID actually belongs to this order
            const normalTickets = order.tickets?.normal || 0;
            const vipTickets = order.tickets?.vip || 0;
            const validIds = [];
            for (let i = 1; i <= normalTickets; i++)
              validIds.push(`${ref}-N${i}`);
            for (let i = 1; i <= vipTickets; i++) validIds.push(`${ref}-V${i}`);

            if (seatId && !validIds.includes(seatId)) {
              renderInvalid(
                "This seat ID is not part of the order. The ticket may have been tampered with."
              );
              return;
            }
            renderValid(order);
          } else if (order.status === "rejected") {
            renderInvalid("This order was rejected. Entry not permitted.");
          } else {
            renderInvalid(
              "This ticket has not been approved yet (payment pending review)."
            );
          }
        } catch (err) {
          renderInvalid(
            "Could not reach the verification server. Check your internet connection and try again."
          );
        }
      }

      verify();
    </script>
  </body>
</html>
